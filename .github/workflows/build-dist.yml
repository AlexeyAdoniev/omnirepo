name: Build dist branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Yarn
        run: corepack enable && corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test

      - name: Build package
        run: yarn build

      - name: Update dist branch
        run: |
          mkdir -p "$RUNNER_TEMP/omnirepo-package"
          cp package.json "$RUNNER_TEMP/omnirepo-package/package.json"
          cp -R dist "$RUNNER_TEMP/omnirepo-package/dist"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --orphan dist
          cp "$RUNNER_TEMP/omnirepo-package/package.json" package.json
          cp -R "$RUNNER_TEMP/omnirepo-package/dist" dist
          git add package.json dist
          git commit -m 'Build dist package'
          git push origin HEAD:dist --force
